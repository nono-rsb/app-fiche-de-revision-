<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Révise apps</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bff"/>
      <stop offset="0.55" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#ff5ea8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#eef0ff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d4df5"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0a0"/>
      <stop offset="1" stop-color="#0fb878"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1b1060" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <ellipse cx="880" cy="1000" rx="520" ry="300" fill="#ffb86b" opacity="0.22"/>
    <!-- fiches empilées -->
    <g transform="rotate(-11 512 530)" filter="url(#sh)">
      <rect x="290" y="250" width="450" height="560" rx="76" fill="#fff" opacity="0.30"/>
    </g>
    <g transform="rotate(7 512 530)" filter="url(#sh)">
      <rect x="290" y="250" width="450" height="560" rx="76" fill="#fff" opacity="0.50"/>
    </g>
    <g filter="url(#sh)">
      <rect x="290" y="250" width="450" height="560" rx="76" fill="url(#glass)"/>
      <rect x="291.500" y="251.500" width="447" height="557" rx="74.500" fill="none" stroke="#fff" stroke-width="3" opacity="0.9"/>
    </g>
    <rect x="352" y="346" width="326" height="38" rx="19" fill="url(#ink)"/>
    <rect x="352" y="420" width="250" height="34" rx="17" fill="#9aa3ff" opacity="0.85"/>
    <rect x="352" y="490" width="290" height="34" rx="17" fill="#9aa3ff" opacity="0.6"/>
    <rect x="352" y="560" width="190" height="34" rx="17" fill="#9aa3ff" opacity="0.4"/>
    <!-- pastille « révisé » -->
    <g filter="url(#sh)">
      <circle cx="668" cy="712" r="104" fill="url(#ok)"/>
      <circle cx="668" cy="712" r="102" fill="none" stroke="#fff" stroke-width="4" opacity="0.7"/>
    </g>
    <path d="M620 714 l34 36 l66 -80" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- reflet de verre sur la tuile -->
    <path d="M0 0 H1024 V300 C760 380 330 380 0 250 Z" fill="#fff" opacity="0.10"/>
    <rect x="3" y="3" width="1018" height="1018" rx="227" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6"/>
  </g>
</svg>
